[project]
name = "pg-legacy-replication"
version = "0.1.0"
description = "dlt source replicating a Postgres < 10 database via Debezium's decoderbufs plugin"
authors = [
    { name = "Nicolas ESTRADA", email = "nicolas.estrada@42.fr" }
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "dlt[duckdb,parquet,postgres,sql-database]<=1.12.3",
    "psycopg2-binary>=2.9.9",
    "protobuf>=5",
    "sqlalchemy>=1.4",
    # dlt 1.8.1 still imports pkg_resources, which setuptools 81 removed
    "setuptools<81",
]

# Not a distribution: the pg_legacy_replication folder is vendored by copying it
# into a project, exactly as `dlt init` would.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# Generated by protoc / mypy-protobuf.
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]

[tool.ruff.lint]
# Deliberately narrow for now. The code is moved as-is and has not been run
# through ruff; widening the rule set (I, B, UP) is its own change.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These imports look unused but are load-bearing: importing the fixtures is what
# registers them as autouse. `ruff check --fix` would happily delete them and
# quietly disable dataset cleanup and storage isolation for the whole suite.
"tests/conftest.py" = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# carried over from the monorepo's tox.ini flake8 config
"datetime".msg = "use dlt.common.pendulum"
"decimal".msg = "use dlt.common.decimal"
"decimal.Decimal".msg = "use dlt.common.Decimal"
"requests".msg = "use dlt.sources.helpers.requests"

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = ["integration: needs a live database with decoderbufs installed and configured"]
addopts = "-v --showlocals --durations 10"
strict_xfail = true
log_cli = 1
log_cli_level = "INFO"
filterwarnings = "ignore:Deprecated call to `pkg_resources.declare_namespace"

[tool.coverage.run]
source = ["sources/pg_legacy_replication"]
omit = ["*_pb2.py", "*_pb2.pyi"]

[tool.pyrefly]
project-includes = ["**/*.py*"]
project-excludes = [
    "*_pb2.py",
    "*_pb2.pyi",
    "tests/conftest.py",
    "tests/utils.py"
]
python-version = "3.11"

[tool.pyrefly.errors]
bad-context-manager  = false
